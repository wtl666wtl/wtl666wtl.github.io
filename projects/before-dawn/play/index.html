<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABIElEQVR42u2XLQ7CQBBGKwkGX4UkPULDCZBIjoBCoHoagkJWcgQ0jgSNxhAEYshsMmQ7afenO0NNN/nMtul7s9tmp1k2DsUBzzOoAvLZBDCDVIdgqHcAm+L/Egh8X7c/gTKfeiXM/RJbYir/PBpwfDjGJXE/LuXgvHoS8Emow9UkbDglReJ1WUEUHPcPwyFdEqd9YdIlgdei4VwC3+g2AYL7JHrBKQZOsSQ4vLeEC477h1GTCIE3JCz47VCa9JaIgRuBFniSRFT1Drj6KtjwulrIwYO+AAaniMFTJMTgLolqPTfhEjQvBm+TIAgXsOdtCbFDCR/EIT4JlRMxVEK1J/AJJMN9rZMtIQ7H4zRmJWKaUp0WTRMe0rUM8k8wDunxBYrodG+NyfW1AAAAAElFTkSuQmCC">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050506; }
    /* 画布铺满整个浏览器窗口；游戏自己按 16:9 等比缩放、两边留黑边。画布不能有边框和内边距，否则鼠标位置会偏 */
    #canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block;
              border: 0; padding: 0; visibility: hidden; outline: none; touch-action: none; image-rendering: pixelated; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               background: #050506; color: #e8d8b0; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    #loading h1 { margin: 0 0 6px; font-size: 44px; letter-spacing: 10px; font-weight: 600; color: #e9c27a; }
    #loading .en { font-size: 13px; letter-spacing: 8px; color: #b9a984; margin-bottom: 36px; }
    #bar { width: 320px; max-width: 70vw; height: 6px; background: #1d1a17; border: 1px solid #3a3226; }
    #fill { width: 0%; height: 100%; background: #c99a4a; transition: width .2s; }
    #status { margin-top: 14px; font-size: 14px; color: #a99c80; min-height: 20px; }
    #credit { position: absolute; bottom: 14px; font-size: 12px; color: #5d5547; }
    #credit a { color: #7d725f; }
  </style>
  <script>
    // Google Analytics; live site only
    if (location.hostname === 'wtl666wtl.github.io') {
      var ga = document.createElement('script');
      ga.async = true;
      ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-HCH7Z5DLZW';
      document.head.appendChild(ga);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-HCH7Z5DLZW');
    }
  </script>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="loading">
    <h1>破晓之前</h1>
    <div class="en">BEFORE DAWN</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="status">正在加载…… Loading…</div>
    <div id="credit">网页版基于 / Built with <a href="https://love2d.org" target="_blank" rel="noopener">LÖVE</a> &amp; <a href="https://github.com/Davidobot/love.js" target="_blank" rel="noopener">love.js</a></div>
  </div>

  <script>
    // 浏览器不许网页自己出声：记下游戏建的音频，玩家第一次点击 / 按键时把它们唤醒
    (function () {
      var ctxs = [];
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (Orig) {
        var Wrapped = function (opts) { var c = opts ? new Orig(opts) : new Orig(); ctxs.push(c); return c; };
        Wrapped.prototype = Orig.prototype;
        window.AudioContext = Wrapped; window.webkitAudioContext = Wrapped;
      }
      function resume() { ctxs.forEach(function (c) { if (c.state !== 'running' && c.resume) c.resume(); }); }
      ['mousedown', 'keydown', 'touchstart', 'click'].forEach(function (ev) { window.addEventListener(ev, resume, true); });
    })();

    // 滚轮：这一版 love.js 把浏览器给的滚动量原样交给游戏，鼠标滚一格就是 100（像素），游戏一下滚到头或尾。
    // 先换算成「格」再交给游戏，和桌面版一样一格一格地滚：像素按 100 一格，行按 3 行一格；触控板的小步会攒够一格再滚
    window.addEventListener('wheel', function (e) {
      if (!e.isTrusted || e.target.id !== 'canvas') return;   // 换算过的那份（自己发的）直接放行
      e.preventDefault(); e.stopImmediatePropagation();
      var k = e.deltaMode === 1 ? 1 / 3 : e.deltaMode === 2 ? 10 : 1 / 100;
      e.target.dispatchEvent(new WheelEvent('wheel', {
        deltaX: e.deltaX * k, deltaY: e.deltaY * k, deltaMode: 0, bubbles: true, cancelable: true,
        clientX: e.clientX, clientY: e.clientY, screenX: e.screenX, screenY: e.screenY,
        ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, altKey: e.altKey, metaKey: e.metaKey
      }));
    }, {capture: true, passive: false});

    // 空格、方向键别让页面滚动；点一下画布把键盘焦点交给游戏
    window.addEventListener('keydown', function (e) { if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault(); }, false);
    window.onload = function () { window.focus(); };
    window.onclick = function () { window.focus(); };

    var statusEl = document.getElementById('status'), fillEl = document.getElementById('fill');
    function showStatus(text) {
      var m = /\((\d+)\/(\d+)\)/.exec(text || '');
      if (/Downloading/.test(text || '') && m) {
        var p = Math.min(100, Math.round(m[1] / Math.max(1, m[2]) * 100));
        fillEl.style.width = p + '%'; statusEl.textContent = '正在下载游戏数据 Downloading… ' + p + '%';
      } else if (/Preparing/.test(text || '')) {
        fillEl.style.width = '100%'; statusEl.textContent = '正在准备 Preparing…';
      } else if (/Running|complete/.test(text || '')) {
        fillEl.style.width = '100%'; statusEl.textContent = '马上就好 Almost there…';
      } else if (text) {
        statusEl.textContent = text;
      }
    }

    var Module = {
      arguments: ["./game.love"],
      INITIAL_MEMORY: 134217728,
      printErr: console.error.bind(console),
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function (e) { alert('显卡上下文丢失，请刷新页面。 / WebGL context lost — please reload the page.'); e.preventDefault(); }, false);
        return canvas;
      })(),
      setStatus: function (text) {
        if (text) { showStatus(text); }
        else if (Module.remainingDependencies === 0) {
          document.getElementById('loading').style.display = 'none';
          var c = document.getElementById('canvas'); c.style.visibility = 'visible'; c.focus();
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function (left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = function () {
      statusEl.textContent = '出错了：请刷新页面重试 / Something went wrong — please reload the page';
      Module.setStatus = function (text) { if (text) Module.printErr('[post-exception status] ' + text); };
    };
    var applicationLoad = function () { Love(Module); };
  </script>
  <script src="game.js"></script>
  <script async src="love.js" onload="applicationLoad(this)"></script>
</body>
</html>
