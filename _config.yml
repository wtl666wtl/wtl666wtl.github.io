name: Tianle Wang
description: "Tianle Wang is a Ph.D. student at Purdue University researching LLM reasoning, planning, and reinforcement learning."
url: "https://wtl666wtl.github.io"
baseurl: ""
avatar: /images/jjz.jpg

# Publications are data for the homepage, not separate blog pages.
collections:
  publications:
    output: false

kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  style: compressed
plugins:
  - jekyll-sitemap

# Retain inherited template material locally without publishing it.
exclude:
  - _posts
  - .claude
  - _temp
  - scripts
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - package.json
  - package-lock.json
